<!-- loading="lazy" Attribute Code IMAGE TAG IN HTML-->
<!DOCTYPE html>
<html lang="en">
<head>
    <title>Title Attribute</title>
</head>
<body>
<img 
  src=https://thumbs.dreamstime.com/b/beautiful-morning-sunrise-blue-sea-pink-sky-white-clouds-yellow-sun-glow-golden-reflection-water-peaceful-landscape-quiet-198646847.jpg 
  alt="Beautiful tropical beach with white sand and blue ocean at sunset" 
  width="800" 
  height="450" 
  loading="lazy" 
  style="border-radius: 8px; max-width: 100%; height: auto; box-shadow: 0 4px 8px rgba(0,0,0,0.1);"
    title="Click here to see sunset!">
</body>
</html>
